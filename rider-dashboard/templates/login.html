{% extends "base.html" %}
{% block title %}Staff Login — AquaDash{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="card">
    <h1 style="margin: 0 0 0.25rem; font-size: 1.35rem;">Staff Sign In</h1>
    <p style="margin: 0 0 1.25rem; color: #64748b; font-size: 0.9rem;">
      Authentication is required to protect private household delivery addresses.
    </p>

    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="role">Staff Role</label>
        <select id="role" name="role" required>
          <option value="rider" {% if selected_role == 'rider' %}selected{% endif %}>
            Delivery Rider (Orders &amp; Delivery Marking)
          </option>
          <option value="owner" {% if selected_role == 'owner' %}selected{% endif %}>
            Station Owner (Slot Fullness Overview)
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Staff Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          required
          autocomplete="current-password"
          placeholder="Enter staff password"
        />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.7rem;">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
