{% extends "base.html" %}
{% block title %}Sign In — AquaDash{% endblock %}

{% block content %}
<div class="animate-fade-up mx-auto mt-10 max-w-sm sm:mt-16">
  <div class="rounded-2xl border border-zinc-200/80 bg-white p-6 shadow-xs sm:p-7">
    <h1 class="text-center text-xl font-bold tracking-tight text-zinc-950">Staff Sign In</h1>

    <form method="post" action="{{ url_for('login') }}" class="mt-6 space-y-4">
      <div class="grid grid-cols-2 gap-1 rounded-xl border border-zinc-200/80 bg-zinc-100/90 p-1">
        <label class="cursor-pointer">
          <input
            type="radio"
            name="role"
            value="rider"
            class="role-radio sr-only"
            {% if selected_role != 'owner' %}checked{% endif %}
          />
          <span class="role-label flex h-9 items-center justify-center rounded-lg text-sm font-semibold text-zinc-500 transition-all duration-150">
            Rider
          </span>
        </label>
        <label class="cursor-pointer">
          <input
            type="radio"
            name="role"
            value="owner"
            class="role-radio sr-only"
            {% if selected_role == 'owner' %}checked{% endif %}
          />
          <span class="role-label flex h-9 items-center justify-center rounded-lg text-sm font-semibold text-zinc-500 transition-all duration-150">
            Owner
          </span>
        </label>
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-zinc-700">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          class="flex h-11 w-full rounded-xl border border-zinc-200 bg-white px-3.5 text-[15px] text-zinc-950 shadow-2xs transition placeholder:text-zinc-400 hover:border-zinc-300 focus:border-sky-500 focus:ring-3 focus:ring-sky-500/15 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        class="inline-flex h-11 w-full items-center justify-center rounded-xl bg-zinc-950 px-4 text-[15px] font-semibold text-white shadow-xs transition hover:bg-zinc-800 active:scale-[0.98] cursor-pointer"
      >
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
